---
name: fedora-atomic-blue9
description: OS 9 in an atomic fashion

base-image: quay.io/fedora/fedora-bootc
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Build the Fedora/Xfce workstation layer
  - type: dnf 
    group-install:
      packages:
        - xfce-desktop-environment
    install:
      packages:
        - lightdm
        - lightdm-gtk
        - make
        - NetworkManager
        - NetworkManager-wifi
        - network-manager-applet
        - gvfs
        - gvfs-mtp
        - gvfs-smb
        - thunar-volman
        - xdg-desktop-portal
        - xdg-desktop-portal-gtk
        - git 
        - plymouth
        - plymouth-plugin-script
        - plymouth-system-theme

  - type: script
    scripts:
      - 00-image-info.sh
      - 01-main.sh
      - 10-platinum9.sh
      - 11-b00merang.sh
      - 12-system8-luks.sh
      - 20-retrosmart-cursors.sh
      - 22-fonts.sh

  - type: systemd
    system:
      enabled:
        - lightdm.service
        - NetworkManager.service

  - type: script
    scripts:
      - 90-finalize.sh

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
        - org.mozilla.firefox
        - com.tomjwatson.Emote
        - org.libreoffice.LibreOffice

  # Embed the selected System8-LUKS Plymouth theme and disk-unlock UI.
  - type: initramfs

  - type: signing
