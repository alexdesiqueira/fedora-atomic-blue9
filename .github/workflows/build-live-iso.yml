---
name: Build Blue9 Live ISO

on:
  workflow_run:
    workflows:
      - bluebuild
    types:
      - completed
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/alexdesiqueira"
  IMAGE_NAME: "fedora-atomic-blue9"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISOs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.event != 'pull_request')
    runs-on: 'ubuntu-24.04'
    strategy:
      fail-fast: false
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Format image ref
        id: image_ref
        run: |
          OUTPUT_NAME="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          echo "image_ref=$OUTPUT_NAME" >> "${GITHUB_OUTPUT}"

      # Titanoboa uses sudo/rootful Podman, so pull into root's image storage.
      - name: Authenticate and pull published image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.image_ref.outputs.image_ref }}
        run: |
          echo "${GHCR_TOKEN}" | sudo podman login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          sudo podman pull "${IMAGE_REF}"

      - name: Build ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: ${{ steps.image_ref.outputs.image_ref }}

      - name: Rename ISO
        id: rename
        env:
          OUTPUT_PATH: ${{ steps.build.outputs.iso-dest }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}-live
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          set -x
          mkdir -p output
          OUTPUT_DIRECTORY="$(realpath output)"
          sha256sum "${OUTPUT_PATH}" | tee "${OUTPUT_DIRECTORY}/${IMAGE_NAME}-${DEFAULT_TAG}.iso-CHECKSUM"
          mv "${OUTPUT_PATH}" "${OUTPUT_DIRECTORY}/${IMAGE_NAME}-${DEFAULT_TAG}.iso"
          echo "output_directory=$OUTPUT_DIRECTORY" >> "${GITHUB_OUTPUT}"

      #- name: Upload to Job Artifacts
        #  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        #with:
        #  name: ${{ env.IMAGE_NAME }}-${{ env.DEFAULT_TAG }}-iso
        #  if-no-files-found: error
        #  path: ${{ steps.build.outputs.iso-dest }}

      - name: Upload to CloudFlare
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SOURCE_DIR: ${{ steps.rename.outputs.output_directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy "${SOURCE_DIR}" R2:ublue-ledif
