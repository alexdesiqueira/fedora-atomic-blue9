---
name: Build Blue9 ISO

on:
  schedule:
    - cron: "00 10 * * 1" # latest successfully published image, every Monday
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to resolve to an immutable digest
        required: false
        default: latest
        type: string

env:
  IMAGE_REGISTRY: "ghcr.io/alexdesiqueira"
  IMAGE_NAME: "fedora-atomic-blue9"
  DEFAULT_TAG: ${{ inputs.image_tag || 'latest' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ISOs
    runs-on: 'ubuntu-24.04'
    strategy:
      fail-fast: false
    permissions:
      contents: write
      packages: read
      id-token: write

    steps:

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Format image ref
        id: image_ref
        run: |
          IMAGE_REPOSITORY="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          {
            echo "repository=$IMAGE_REPOSITORY"
            echo "tagged_ref=${IMAGE_REPOSITORY}:${DEFAULT_TAG}"
          } >> "${GITHUB_OUTPUT}"

      # Titanoboa uses sudo/rootful Podman, so pull into root's image storage.
      - name: Resolve and pull immutable image
        id: resolved_image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_REPOSITORY: ${{ steps.image_ref.outputs.repository }}
          TAGGED_REF: ${{ steps.image_ref.outputs.tagged_ref }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | sudo podman login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          sudo podman pull "${TAGGED_REF}"
          DIGEST="$(sudo podman image inspect --format '{{.Digest}}' "${TAGGED_REF}")"
          test -n "${DIGEST}"
          IMAGE_REF="${IMAGE_REPOSITORY}@${DIGEST}"
          BUILD_ID="${DIGEST#sha256:}"
          BUILD_ID="${BUILD_ID:0:12}"
          sudo podman pull "${IMAGE_REF}"
          {
            echo "image_ref=${IMAGE_REF}"
            echo "digest=${DIGEST}"
            echo "build_id=${BUILD_ID}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4

      - name: Verify image signature
        env:
          IMAGE_REF: ${{ steps.resolved_image.outputs.image_ref }}
        run: cosign verify --key cosign.pub "${IMAGE_REF}"

      - name: Build ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: ${{ steps.resolved_image.outputs.image_ref }}

      - name: Rename ISO
        id: rename
        env:
          OUTPUT_PATH: ${{ steps.build.outputs.iso-dest }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}-live
          BUILD_ID: ${{ steps.resolved_image.outputs.build_id }}
          IMAGE_REF: ${{ steps.resolved_image.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.resolved_image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p output
          OUTPUT_DIRECTORY="$(realpath output)"
          ISO_NAME="${IMAGE_NAME}-${BUILD_ID}.iso"
          mv "${OUTPUT_PATH}" "${OUTPUT_DIRECTORY}/${ISO_NAME}"
          (
            cd "${OUTPUT_DIRECTORY}"
            sha256sum "${ISO_NAME}" > "${ISO_NAME}-CHECKSUM"
          )
          jq -n \
            --arg iso_name "${ISO_NAME}" \
            --arg image_ref "${IMAGE_REF}" \
            --arg image_digest "${IMAGE_DIGEST}" \
            --arg build_id "${BUILD_ID}" \
            --arg created_at "$(date --utc --iso-8601=seconds)" \
            '{iso_name: $iso_name, image_ref: $image_ref,
              image_digest: $image_digest, build_id: $build_id,
              created_at: $created_at}' \
            > "${OUTPUT_DIRECTORY}/${ISO_NAME}.json"
          {
            echo "iso_path=${OUTPUT_DIRECTORY}/${ISO_NAME}"
            echo "output_directory=$OUTPUT_DIRECTORY"
          } >> "${GITHUB_OUTPUT}"

      - name: Install ISO validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Validate ISO structure
        env:
          ISO_PATH: ${{ steps.rename.outputs.iso_path }}
        run: tests/validate_iso.sh "${ISO_PATH}"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blue9-live-${{ steps.resolved_image.outputs.build_id }}
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ steps.rename.outputs.iso_path }}
            ${{ steps.rename.outputs.iso_path }}-CHECKSUM
            ${{ steps.rename.outputs.iso_path }}.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_PATH: ${{ steps.rename.outputs.iso_path }}
          BUILD_ID: ${{ steps.resolved_image.outputs.build_id }}
          IMAGE_REF: ${{ steps.resolved_image.outputs.image_ref }}
        run: |
          set -euo pipefail
          size="$(stat -c %s "${ISO_PATH}")"
          if (( size >= 2 * 1024 * 1024 * 1024 )); then
            echo "::warning::ISO is ${size} bytes and exceeds GitHub's release asset limit; available as a workflow artifact instead."
            exit 0
          fi
          tag="live-${BUILD_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "Blue9 live ${BUILD_ID}" \
            --notes "Live ISO built from ${IMAGE_REF}." \
            --prerelease \
            "${ISO_PATH}" "${ISO_PATH}-CHECKSUM" "${ISO_PATH}.json"
